name: pili_aurora
description: PiliAurora, a Flutter Bilibili client for Android and Windows.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# update when release
version: 1.0.6+91

environment:
  sdk: ">=3.13.0"
  flutter: 3.47.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  app_links: ^7.1.1
  archive: ^4.0.0
  audio_service: 0.18.19+piliaurora.1
  audio_session: ^0.2.4
  battery_plus: ^7.0.0
  brotli: ^0.6.0
  cached_network_image_ce: 4.6.4+piliaurora.2
  canvas_danmaku: 0.2.6+piliaurora.1
  catcher_2: 2.1.9+piliaurora.1
  characters: ^1.4.1
  chat_bottom_container: 0.5.2+piliaurora.1
  collection: ^1.19.1
  connectivity_plus: ^7.1.1
  cookie_jar: ^4.0.8
  crypto: ^3.0.6
  cupertino_ui: ^1.0.0
  device_info_plus: ^13.1.0
  dio: ^5.9.1
  dio_http2_adapter: ^2.7.1
  dlna_dart: ^0.1.0
  dynamic_color: ^2.1.0
  encrypt: ^5.0.3
  extended_nested_scroll_view: 6.2.1+piliaurora.1
  ffi: ^2.2.0
  file_picker: ^13.1.0
  fixnum: ^1.1.1
  fl_chart: ^1.0.0
  flex_seed_scheme: ^5.0.0
  flutter_displaymode: ^0.7.0
  flutter_html: 3.0.0+piliaurora.1
  flutter_inappwebview: ^6.1.5
  flutter_smart_dialog: ^5.3.0
  flutter_sortable_wrap: 1.0.6+piliaurora.1
  flutter_svg: ^2.0.14
  flutter_volume_controller: ^2.0.0
  font_awesome_flutter: ^11.0.0
  get: 4.7.2+piliaurora.1
  hive_ce: ^2.20.1
  html: ^0.15.4
  http2: ^2.3.1
  image_cropper: ^12.0.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  jni: ^1.1.0
  logger: ^2.5.0
  material_color_utilities: ^0.13.0
  material_design_icons_flutter: 7.0.7447+piliaurora.1
  material_new_shapes: ^1.0.0
  material_ui: ">=1.0.0 <1.5.0"
  media_kit: 1.1.11+piliaurora.1
  media_kit_libs_video: 1.0.5
  media_kit_video: 1.2.5+piliaurora.1
  mime: ^2.0.0
  native_device_orientation: 2.0.5+piliaurora.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler_android: ^14.0.0
  permission_handler_platform_interface: ^4.3.0
  pretty_qr_code: ^3.3.0
  protobuf: ^6.0.0
  re_highlight: ^0.0.3
  saver_gallery: ^5.0.2
  screen_brightness_platform_interface: ^2.1.0
  screen_retriever: ^0.2.0
  share_plus: ^13.1.0
  super_sliver_list: 0.4.1+piliaurora.1
  synchronized: ^3.3.0
  tray_manager: ^0.7.0
  url_launcher: ^6.3.1
  vector_math: ^2.2.0
  wakelock_plus: ^1.2.8
  waterfall_flow: ^3.1.0
  web_socket_channel: ^3.0.3
  webdav_client: ^1.2.2
  win32: ^6.3.0
  window_manager: ^0.5.2

dependency_overrides:
  # 定制包的来源、版本和保留原因见 third_party/dependencies.json。
  audio_service:
    path: third_party/audio_service
  cached_network_image_ce:
    path: third_party/cached_network_image_ce
  canvas_danmaku:
    path: third_party/canvas_danmaku
  catcher_2:
    path: third_party/catcher_2
  chat_bottom_container:
    path: third_party/chat_bottom_container
  extended_nested_scroll_view:
    path: third_party/extended_nested_scroll_view
  flutter_html:
    path: third_party/flutter_html
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
  flutter_sortable_wrap:
    path: third_party/flutter_sortable_wrap
  get:
    path: third_party/get
  material_design_icons_flutter:
    path: third_party/material_design_icons_flutter
  media_kit:
    path: third_party/media_kit
  media_kit_libs_android_video:
    path: third_party/media_kit_libs_android_video
  media_kit_video:
    path: third_party/media_kit_video
  native_device_orientation:
    path: third_party/native_device_orientation
  super_sliver_list:
    path: third_party/super_sliver_list
  flutter_inappwebview_windows:
    path: third_party/flutter_inappwebview_windows
  media_kit_libs_windows_video:
    path: third_party/media_kit_libs_windows_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  jnigen: ^1.0.1
  # 本地 super_sliver_list 保留上游 strict 检查规则。
  lint: ^2.8.0
  pub_semver: ^2.2.0
  yaml: ^3.1.3

flutter_launcher_icons:
  android: true
  image_path: assets/images/logo/logo_2.png
  image_path_android: assets/images/logo/logo_2.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/logo/logo_2.png
  adaptive_icon_monochrome: assets/images/logo/logo_2.png

flutter_native_splash:
  android_12:
    color: "#ffffff"
    color_dark: "#212121"
  color: "#ffffff"
  color_dark: "#212121"
  image: assets/images/logo/logo_2.png
  image_dark: assets/images/logo/logo_2.png

flutter:
  uses-material-design: true

  assets:
    - path: assets/images/
    - path: assets/images/logo/
    - path: assets/images/logo/ico/
      platforms: [windows]
    - path: assets/images/live/
    - path: assets/images/paycoins/
    - path: assets/shaders/

  fonts:
    - family: digital_id_num
      fonts:
        - asset: assets/fonts/digital_id_num.ttf
    - family: custom_icon
      fonts:
        - asset: assets/fonts/custom_icon.ttf
