name: audio_service
publish_to: none
description: Flutter plugin to play audio in the background while the screen is off.
version: 0.18.19+piliaurora.1
repository: https://github.com/ryanheise/audio_service/tree/minor/audio_service
issue_tracker: https://github.com/ryanheise/audio_service/issues
topics:
  - audio
  - background

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  audio_service_platform_interface: ^0.1.3
  audio_service_web: ^0.1.4
  audio_session: ^0.2.4
  rxdart: '>=0.26.0 <0.29.0'
  cached_network_image_ce: ^4.6.4
  clock: ^1.1.0
  js: '>=0.6.3 <0.8.0'
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0
  fake_async: ^1.2.0
  flutter_lints: ^3.0.1

flutter:
  plugin:
    platforms:
      android:
        package: com.ryanheise.audioservice
        pluginClass: AudioServicePlugin
      ios:
        pluginClass: AudioServicePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AudioServicePlugin
        sharedDarwinSource: true
      web:
        default_package: audio_service_web
