name: media_kit
publish_to: none
description: A cross-platform video player & audio player for Flutter & Dart. Performant, stable, feature-proof & modular.
homepage: https://github.com/media-kit/media-kit
repository: https://github.com/media-kit/media-kit
version: 1.1.11+piliaurora.1

topics:
  - video
  - video-player
  - audio
  - audio-player
  - cross-platform

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.29.0 <4.0.0"

dependencies:
  meta: ^1.8.0
  path: ^1.8.0
  collection: ^1.17.0
  synchronized: ^3.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  test: ^1.24.1
  lints: ^6.1.0
  http: ">=0.13.0 <2.0.0"

ffigen:
  name: MPV
  output: lib/generated/libmpv/bindings.dart
  headers:
    entry-points:
      - headers/client.h
  type-map:
    native-types:
      char:
        lib: ffi
        c-type: Uint8
        dart-type: int
  exclude-all-by-default: true
  enums:
    include:
      - 'mpv_.*'
    as-int:
      exclude: []
  functions:
    include:
      - 'mpv_.*'
    leaf:
      include:
        - 'mpv_get_time_ns'
        - 'mpv_get_time_us'
        - 'mpv_client_name'
        - 'mpv_client_id'
        - 'mpv_client_api_version'
        - 'mpv_event_name'
        - 'mpv_error_string'
  structs:
    include:
      - 'mpv_.*'
  unions:
    include:
      - 'mpv_.*'
  globals:
    include:
      - 'mpv_.*'
  macros:
    include:
      - 'mpv_.*'
