name: Bug 反馈
description: 反馈 PiliAurora 使用中遇到的问题
labels: [bug]
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。公开提交前请检查截图和日志，移除 Cookie、Token、私信及其他个人信息。
  - type: input
    id: version
    attributes:
      label: PiliAurora 版本
      description: 请填写版本号及安装来源。
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android
        - Windows
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统和设备
      description: 请填写系统版本及设备型号；Windows 用户可填写显卡型号。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序描述操作，以及问题是否每次出现。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果和预期结果
    validations:
      required: true
  - type: textarea
    id: graphics
    attributes:
      label: 播放或画面问题补充
      description: Android 请填写机型、系统版本、视频编码和硬解设置；Windows 请填写显卡、驱动版本、视频编码、硬解及超分设置。非画面问题可留空。
  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 可补充已尝试的排查步骤、脱敏后的报错片段、截图或录屏；如与特定视频有关，可提供公开的 BV 号。
