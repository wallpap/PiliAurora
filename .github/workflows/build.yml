name: Build Android and Windows x64

on:
    # pull_request:
    #     types:
    #         - opened
    #         - synchronize
    #         - reopened
    #         - ready_for_review
    #     paths-ignore:
    #         - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android APK"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Windows x64"
                required: false
                default: true
                type: boolean

            tag:
                description: "Release tag; empty only uploads workflow artifacts"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'wallpap/PiliAurora') || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Flutter patches
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write signing key
              if: github.event_name == 'workflow_dispatch'
              run: |
                  if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Write version and build info
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android -Version '${{ github.event.inputs.tag }}'

            - name: Build release APK
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Build dev APK
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

            - name: Rename APK with version and ABI
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliAurora_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: PiliAurora_android_*.apk

            - name: Upload arm64-v8a APK
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  if-no-files-found: error
                  name: PiliAurora_android_${{ env.version }}_arm64-v8a
                  path: PiliAurora_android_*_arm64-v8a.apk

            - name: Upload armeabi-v7a APK
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  if-no-files-found: error
                  name: PiliAurora_android_${{ env.version }}_armeabi-v7a
                  path: PiliAurora_android_*_armeabi-v7a.apk

            - name: Upload x86_64 APK
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  if-no-files-found: error
                  name: PiliAurora_android_${{ env.version }}_x86_64
                  path: PiliAurora_android_*_x86_64.apk

    win_x64:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'wallpap/PiliAurora') || github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
