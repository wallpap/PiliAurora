name: Build Android and Windows x64

on:
    # pull_request:
    #     types:
    #         - opened
    #         - synchronize
    #         - reopened
    #         - ready_for_review
    #     paths-ignore:
    #         - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android APK"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Windows x64"
                required: false
                default: true
                type: boolean

            tag:
                description: "Release tag; empty only uploads workflow artifacts"
                required: false
                default: ""
                type: string

            draft_release:
                description: "Keep uploaded release assets in a draft until final verification"
                required: false
                default: false
                type: boolean

jobs:
    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'wallpap/PiliAurora') || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "25"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties
                      android/gradle/gradle-daemon-jvm.properties

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Flutter patches
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Check dependency sources and versions
              run: dart run tool/check_dependencies.dart

            - name: Test dependency migration contracts
              run: >-
                flutter test --no-pub
                test/architecture/dependency_policy_test.dart
                test/architecture/internal_dependencies_test.dart
                test/common/widgets/font_awesome_icons_test.dart
                test/common/widgets/debounced_state_test.dart
                test/common/widgets/image/image_lifecycle_test.dart
                test/utils/random_id_test.dart
                test/utils/rate_limiter_test.dart
                test/services/diagnostics/app_logger_test.dart
                test/services/diagnostics/catcher_logging_test.dart
                test/services/settings/webdav_client_test.dart
                test/architecture/dependency_rules_test.dart
                test/architecture/release_workflow_test.dart
                test/pages/common/common_controller_test.dart
                test/services/settings/settings_backup_test.dart
                test/services/settings/webdav_sync_test.dart
                test/services/diagnostics_test.dart
                test/plugin/pl_player/video_output_resizer_test.dart
                test/plugin/pl_player/android_video_output_test.dart
                test/plugin/pl_player/video_output_size_test.dart

            - name: Write signing key
              if: github.event_name == 'workflow_dispatch'
              run: |
                  set -euo pipefail

                  test -n "${{ secrets.SIGN_KEYSTORE_BASE64 }}" || {
                    echo "SIGN_KEYSTORE_BASE64 is missing"
                    exit 1
                  }
                  test -n "${{ secrets.KEYSTORE_PASSWORD }}" || {
                    echo "KEYSTORE_PASSWORD is missing"
                    exit 1
                  }
                  test -n "${{ secrets.KEY_ALIAS }}" || {
                    echo "KEY_ALIAS is missing"
                    exit 1
                  }
                  test -n "${{ secrets.KEY_PASSWORD }}" || {
                    echo "KEY_PASSWORD is missing"
                    exit 1
                  }

                  echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                  test -s android/app/key.jks
                  {
                    echo "storeFile=key.jks"
                    echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
                    echo "keyAlias=${{ secrets.KEY_ALIAS }}"
                    echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
                  } >> android/key.properties

            - name: Write version and build info
              shell: pwsh
              run: lib/scripts/build.ps1 android -Version '${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}'

            - name: Export Android version
              id: android_version
              shell: bash
              run: printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - name: Build release APK
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Build dev APK
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

            - name: Rename APK with version and ABI
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliAurora_android_${{ steps.android_version.outputs.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  draft: ${{ inputs.draft_release }}
                  files: PiliAurora_android_*.apk

            - name: Upload arm64-v8a APK
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  if-no-files-found: error
                  name: PiliAurora_android_${{ steps.android_version.outputs.version }}_arm64-v8a
                  path: PiliAurora_android_*_arm64-v8a.apk

            - name: Upload armeabi-v7a APK
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  if-no-files-found: error
                  name: PiliAurora_android_${{ steps.android_version.outputs.version }}_armeabi-v7a
                  path: PiliAurora_android_*_armeabi-v7a.apk

            - name: Upload x86_64 APK
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  if-no-files-found: error
                  name: PiliAurora_android_${{ steps.android_version.outputs.version }}_x86_64
                  path: PiliAurora_android_*_x86_64.apk

    win_x64:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'wallpap/PiliAurora') || github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
            draft_release: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_release }}
