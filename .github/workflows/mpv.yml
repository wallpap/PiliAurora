name: Verify upstream Windows libmpv

on:
  workflow_dispatch:

jobs:
  verify-mpv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Download and verify upstream package
        run: python tool/verify_libmpv.py
      - uses: actions/upload-artifact@v7
        with:
          name: upstream-mpv-windows-x64
          if-no-files-found: error
          path: |
            build/upstream-mpv/*.7z
            third_party/media_kit_libs_windows_video/windows/libmpv.json
