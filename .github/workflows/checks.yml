name: Code checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Flutter patches and prepare dependencies
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Check dependency sources and versions
        run: dart --packages=.dart_tool/package_config.json tool/check_dependencies.dart

      - name: Analyze playback, danmaku, tests and tools
        run: flutter analyze --no-pub lib/plugin/pl_player lib/pages/danmaku test tool

      - name: Run CI tests
        shell: pwsh
        run: pwsh -NoProfile -File tool/run-ci-tests.ps1 -FlutterTool path

      - name: Run Android host probes
        shell: pwsh
        run: pwsh -NoProfile -File tool/run-native-probes.ps1

      - name: Test frame-plan selection and fallback
        run: |
          c++ -std=c++17 -pthread tool/engine/frame_plan/frame_presentation_plan_test.cc -o "$RUNNER_TEMP/frame-plan-test"
          "$RUNNER_TEMP/frame-plan-test"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Test capture and engine identity
        run: |
          python -m unittest discover -s tool/probes/android -p '*_test.py' -v
          python -m unittest discover -s tool/engine -p '*_test.py' -v
          python tool/probes/windows/windows_frame_sampling_probe.py
          python tool/probes/windows/windows_angle_rollback_probe.py
          python tool/probes/windows/windows_renderer_release_probe.py
          python -m unittest discover -s tool/engine/frame_plan -p '*_test.py' -v
          python -m unittest discover -s tool/packaging -p '*_test.py' -v
