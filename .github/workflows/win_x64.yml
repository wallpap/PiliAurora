name: Build Windows x64

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag; empty skips publishing a release"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; empty skips publishing a release"
        required: false
        default: ""
        type: string

jobs:
  build-windows-app:
    name: Release Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Write version and build info
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Build Windows release
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,no-pub" --skip-clean

      - name: Package Windows portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portable = "PiliAurora_windows_${{ env.version }}_x64"
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          New-Item -ItemType Directory -Path PiliAurora-Win-Setup -Force | Out-Null
          Copy-Item "build/windows/x64/runner/Release/*" $portable -Recurse -Force
          Move-Item "dist/*.exe" "PiliAurora-Win-Setup/PiliAurora_windows_${{ env.version }}_x64_setup.exe"
          if (-not (Test-Path "$portable/PiliAurora.exe")) {
            throw "Portable build output is incomplete: $portable/PiliAurora.exe not found"
          }
          Write-Host "Portable folder: $portable"

      - name: Compress Windows portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "PiliAurora_windows_${{ env.version }}_x64" -DestinationPath "PiliAurora_windows_${{ env.version }}_x64_portable.zip"

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliAurora_windows_*_x64_portable.zip
            PiliAurora-Win-Setup/PiliAurora_windows_*_x64_setup.exe

      - name: Upload Windows portable
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: PiliAurora_windows_${{ env.version }}_x64_portable
          path: PiliAurora_windows_*_x64_portable.zip

      - name: Upload Windows setup
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: PiliAurora_windows_${{ env.version }}_x64_setup
          path: PiliAurora-Win-Setup/PiliAurora_windows_*_x64_setup.exe
