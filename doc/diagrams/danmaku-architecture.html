<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>弹幕显示架构 | PiliAurora</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580; --rule:rgba(45,49,66,.12); --accent:#bf4520; --accent-tint:rgba(191,69,32,.08); --link:#2e5aa8; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:'Geist','Noto Sans SC',system-ui,sans-serif; }
    main { max-width:1360px; margin:0 auto; padding:32px 0 24px; } h1 { margin:0 28px 8px; font:400 28px/1.2 'Instrument Serif','Noto Serif SC',serif; }
    .kicker { margin:0 28px 18px; color:var(--muted); font:500 11px/1.5 'Geist Mono',monospace; letter-spacing:.08em; }
    figure { margin:0; }
    .diagram-scroll { width:100%; overflow-x:auto; } svg { display:block; width:100%; min-width:1280px; height:auto; }
    figcaption { max-width:1050px; margin:12px 28px 0; color:var(--muted); font-size:13px; line-height:1.7; }
    .zone { fill:rgba(45,49,66,.02); stroke:rgba(45,49,66,.10); stroke-width:1; } .zone-label-mask { fill:var(--paper); }
    .zone-label { fill:var(--soft); font:500 12px 'Geist','Noto Sans SC',sans-serif; }
    .edge { fill:none; stroke:var(--muted); stroke-width:1.2; marker-end:url(#dm-arrow); }
    .edge-api { fill:none; stroke:var(--link); stroke-width:1.2; marker-end:url(#dm-arrow-link); }
    .edge-async { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:5 4; marker-end:url(#dm-arrow); }
    .node rect.bounds { stroke-width:1; rx:6; } .backend rect.bounds { fill:#fff; stroke:var(--ink); }
    .focal rect.bounds { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
    .store rect.bounds { fill:rgba(45,49,66,.05); stroke:var(--muted); }
    .input rect.bounds { fill:rgba(79,93,117,.10); stroke:var(--soft); }
    .tag { fill:var(--paper); stroke:rgba(45,49,66,.24); stroke-width:.8; rx:2; }
    .tag-text { fill:var(--muted); font:500 8px 'Geist Mono',monospace; letter-spacing:.08em; }
    .name { fill:var(--ink); font:600 14px 'Geist','Noto Sans SC',sans-serif; }
    .sub { fill:var(--muted); font:400 9px 'Geist Mono',monospace; }
    .legend-text { fill:var(--muted); font:500 12px 'Geist','Noto Sans SC',sans-serif; }
  </style>
</head>
<body>
<main>
  <h1>弹幕：来源、时间窗口与显示工作集</h1>
  <p class="kicker">PILIAURORA / DANMAKU ARCHITECTURE</p>
  <figure>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1280 720" role="img" aria-labelledby="danmaku-title danmaku-desc">
        <title id="danmaku-title">弹幕显示架构</title>
        <desc id="danmaku-desc">点播和本地弹幕经过有界处理与时间窗口，直播消息经过独立候选队列；两条路径共同使用显示渲染器与帧调度。</desc>
        <defs>
          <marker id="dm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
          <marker id="dm-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#f5f5f5"/>
        <rect class="zone" x="32" y="84" width="672" height="476" rx="8"/>
        <rect class="zone" x="720" y="84" width="528" height="476" rx="8"/>
        <rect class="zone-label-mask" x="52" y="88" width="130" height="18"/>
        <text class="zone-label" x="60" y="102">来源与准备</text>
        <rect class="zone-label-mask" x="740" y="88" width="150" height="18"/>
        <text class="zone-label" x="748" y="102">时钟与显示</text>

        <path class="edge-api" d="M236 224 H280"/>
        <path class="edge" d="M472 224 H516"/>
        <path class="edge" d="M708 224 H752"/>
        <path class="edge" d="M944 224 H988"/>
        <path class="edge" d="M848 396 V276"/>
        <path class="edge" d="M1118 396 V328"/>
        <path class="edge" d="M140 276 V440 Q140 448 148 448 H280"/>
        <path class="edge" d="M424 396 V360 H840 a8 8 0 0 1 16 0 H1020 V328"/>
        <path class="edge" d="M960 420 H972 V368 a8 8 0 0 1 0 -16 V344 H1060 V328"/>

        <g class="node input">
          <rect class="bounds" x="44" y="172" width="192" height="104"/>
          <rect class="tag" x="56" y="180" width="56" height="16"/><text class="tag-text" x="84" y="191" text-anchor="middle">INPUT</text>
          <text class="name" x="140" y="224" text-anchor="middle">弹幕来源</text>
          <text class="sub" x="140" y="246" text-anchor="middle">gRPC / HTTP · live stream</text>
          <text class="sub" x="140" y="261" text-anchor="middle">local file · room messages</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="280" y="172" width="192" height="104"/>
          <rect class="tag" x="292" y="180" width="62" height="16"/><text class="tag-text" x="323" y="191" text-anchor="middle">SOURCE</text>
          <text class="name" x="376" y="224" text-anchor="middle">来源适配与生命周期</text>
          <text class="sub" x="376" y="246" text-anchor="middle">PlDanmakuController</text>
          <text class="sub" x="376" y="261" text-anchor="middle">VOD · local file</text>
        </g>
        <g class="node store">
          <rect class="bounds" x="516" y="172" width="192" height="104"/>
          <rect class="tag" x="528" y="180" width="68" height="16"/><text class="tag-text" x="562" y="191" text-anchor="middle">BOUNDED</text>
          <text class="name" x="612" y="224" text-anchor="middle">点播解码与处理配额</text>
          <text class="sub" x="612" y="246" text-anchor="middle">DanmakuWorkQuota</text>
          <text class="sub" x="612" y="261" text-anchor="middle">decode · filter · merge</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="752" y="172" width="192" height="104"/>
          <rect class="tag" x="764" y="180" width="68" height="16"/><text class="tag-text" x="798" y="191" text-anchor="middle">TIMELINE</text>
          <text class="name" x="848" y="224" text-anchor="middle">点播范围与窗口</text>
          <text class="sub" x="848" y="246" text-anchor="middle">coverage · rules · cursor</text>
          <text class="sub" x="848" y="261" text-anchor="middle">100ms buckets · prepareFrame</text>
        </g>
        <g class="node focal">
          <rect class="bounds" x="988" y="172" width="260" height="156"/>
          <rect class="tag" x="1000" y="180" width="68" height="16"/><text class="tag-text" x="1034" y="191" text-anchor="middle">DISPLAY</text>
          <text class="name" x="1118" y="224" text-anchor="middle">窗口渲染与显示挂载</text>
          <text class="sub" x="1118" y="248" text-anchor="middle">DanmakuWindowRenderer</text>
          <text class="sub" x="1118" y="266" text-anchor="middle">WindowScreen · Canvas painter</text>
          <text class="sub" x="1118" y="284" text-anchor="middle">working set · hit test · image refs</text>
          <text class="sub" x="1118" y="302" text-anchor="middle">DisplayBinding · selection / clear</text>
        </g>
        <g class="node store">
          <rect class="bounds" x="988" y="396" width="260" height="104"/>
          <rect class="tag" x="1000" y="404" width="54" height="16"/><text class="tag-text" x="1027" y="415" text-anchor="middle">CLOCK</text>
          <text class="name" x="1118" y="448" text-anchor="middle">双时间基准</text>
          <text class="sub" x="1118" y="470" text-anchor="middle">VOD: PlaybackMediaClock anchor</text>
          <text class="sub" x="1118" y="485" text-anchor="middle">LIVE: received monotonic time</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="280" y="396" width="192" height="104"/>
          <rect class="tag" x="292" y="404" width="54" height="16"/><text class="tag-text" x="319" y="415" text-anchor="middle">LIVE</text>
          <text class="name" x="376" y="448" text-anchor="middle">直播候选队列</text>
          <text class="sub" x="376" y="470" text-anchor="middle">LiveDanmakuQueue</text>
          <text class="sub" x="376" y="485" text-anchor="middle">bounded · monotonic age</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="736" y="396" width="224" height="104"/>
          <rect class="tag" x="748" y="404" width="68" height="16"/><text class="tag-text" x="782" y="415" text-anchor="middle">SCHEDULER</text>
          <text class="name" x="848" y="448" text-anchor="middle">弹幕帧调度</text>
          <text class="sub" x="848" y="470" text-anchor="middle">DanmakuFrameScheduler</text>
          <text class="sub" x="848" y="485" text-anchor="middle">targetUs · deadline · Hz</text>
        </g>

        <line x1="32" y1="648" x2="1248" y2="648" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
        <text class="legend-text" x="40" y="680">图例</text>
        <rect x="100" y="666" width="20" height="18" rx="4" fill="#fff" stroke="#2d3142"/><text class="legend-text" x="132" y="680">业务模块</text>
        <rect x="260" y="666" width="20" height="18" rx="4" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/><text class="legend-text" x="292" y="680">有界处理 / 时间状态</text>
        <line x1="492" y1="676" x2="540" y2="676" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#dm-arrow-link)"/><text class="legend-text" x="552" y="680">来源输入</text>
        <line x1="680" y1="676" x2="728" y2="676" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#dm-arrow)"/><text class="legend-text" x="740" y="680">时钟 / 异步更新</text>
        <rect x="928" y="666" width="20" height="18" rx="4" fill="rgba(191,69,32,.08)" stroke="#bf4520"/><text class="legend-text" x="960" y="680">显示工作集</text>
      </svg>
    </div>
    <figcaption>点播来源经过进程配额和范围窗口；直播消息通过独立候选队列进入共享渲染器。点播按媒体锚点投影位置，直播按消息接收时间和可见运行时段推进。</figcaption>
  </figure>
</main>
</body>
</html>
