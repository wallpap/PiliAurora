<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>播放器架构 | PiliAurora</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580; --rule:rgba(45,49,66,.12); --accent:#bf4520; --accent-tint:rgba(191,69,32,.08); --link:#2e5aa8; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:'Geist','Noto Sans SC',system-ui,sans-serif; }
    main { max-width:1360px; margin:0 auto; padding:32px 0 24px; }
    h1 { margin:0 28px 8px; font:400 28px/1.2 'Instrument Serif','Noto Serif SC',serif; }
    .kicker { margin:0 28px 18px; color:var(--muted); font:500 11px/1.5 'Geist Mono',monospace; letter-spacing:.08em; }
    figure { margin:0; }
    .diagram-scroll { width:100%; overflow-x:auto; }
    svg { display:block; width:100%; min-width:1280px; height:auto; }
    figcaption { max-width:1050px; margin:12px 28px 0; color:var(--muted); font-size:13px; line-height:1.7; }
    .zone { fill:rgba(45,49,66,.02); stroke:rgba(45,49,66,.10); stroke-width:1; }
    .zone-label-mask { fill:var(--paper); }
    .zone-label { fill:var(--soft); font:500 12px 'Geist','Noto Sans SC',sans-serif; }
    .edge { fill:none; stroke:var(--muted); stroke-width:1.2; marker-end:url(#player-arrow); }
    .edge-return { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:5 4; marker-end:url(#player-arrow); }
    .edge-api { fill:none; stroke:var(--link); stroke-width:1.2; marker-end:url(#player-arrow-link); }
    .node rect.bounds { stroke-width:1; rx:6; }
    .backend rect.bounds { fill:#fff; stroke:var(--ink); }
    .focal rect.bounds { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
    .store rect.bounds { fill:rgba(45,49,66,.05); stroke:var(--muted); }
    .external rect.bounds { fill:rgba(45,49,66,.03); stroke:rgba(45,49,66,.30); }
    .tag { fill:var(--paper); stroke:rgba(45,49,66,.24); stroke-width:.8; rx:2; }
    .tag-text { fill:var(--muted); font:500 8px 'Geist Mono',monospace; letter-spacing:.08em; }
    .name { fill:var(--ink); font:600 14px 'Geist','Noto Sans SC',sans-serif; }
    .sub { fill:var(--muted); font:400 9px 'Geist Mono',monospace; }
    .legend-text { fill:var(--muted); font:500 12px 'Geist','Noto Sans SC',sans-serif; }
  </style>
</head>
<body>
<main>
  <h1>播放器：计划、会话与原生输出</h1>
  <p class="kicker">PILIAURORA / PLAYER ARCHITECTURE</p>
  <figure>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1280 720" role="img" aria-labelledby="player-title player-desc">
        <title id="player-title">播放器架构</title>
        <desc id="player-desc">展示页面播放计划经所有者和会话提交到原生运行时，并由媒体实例与平台输出承载，播放快照回到界面门面的结构。</desc>
        <defs>
          <marker id="player-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
          <marker id="player-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#f5f5f5"/>
        <rect class="zone" x="32" y="84" width="224" height="468" rx="8"/>
        <rect class="zone" x="276" y="84" width="448" height="468" rx="8"/>
        <rect class="zone" x="744" y="84" width="504" height="524" rx="8"/>
        <rect class="zone-label-mask" x="52" y="88" width="120" height="18"/>
        <text class="zone-label" x="60" y="102">页面与控件</text>
        <rect class="zone-label-mask" x="296" y="88" width="132" height="18"/>
        <text class="zone-label" x="304" y="102">DART 会话核心</text>
        <rect class="zone-label-mask" x="764" y="88" width="150" height="18"/>
        <text class="zone-label" x="772" y="102">原生媒体与平台输出</text>

        <path class="edge-api" d="M240 224 H296"/>
        <path class="edge" d="M488 224 H520"/>
        <path class="edge" d="M712 224 H768"/>
        <path class="edge" d="M960 224 H1000"/>
        <path class="edge" d="M1108 276 V356"/>
        <path class="edge" d="M1108 452 V496"/>
        <path class="edge-return" d="M616 276 V328 H144 V396"/>

        <g class="node backend">
          <rect class="bounds" x="48" y="172" width="192" height="104"/>
          <rect class="tag" x="60" y="180" width="54" height="16"/><text class="tag-text" x="87" y="191" text-anchor="middle">PAGE</text>
          <text class="name" x="144" y="224" text-anchor="middle">点播 / 直播页面</text>
          <text class="sub" x="144" y="246" text-anchor="middle">query · source candidates</text>
          <text class="sub" x="144" y="261" text-anchor="middle">PlaybackPlan assembly</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="296" y="172" width="192" height="104"/>
          <rect class="tag" x="308" y="180" width="58" height="16"/><text class="tag-text" x="337" y="191" text-anchor="middle">OWNER</text>
          <text class="name" x="392" y="224" text-anchor="middle">PlaybackOwner</text>
          <text class="sub" x="392" y="246" text-anchor="middle">request generation · inhibitors</text>
          <text class="sub" x="392" y="261" text-anchor="middle">keep-alive lease</text>
        </g>
        <g class="node focal">
          <rect class="bounds" x="520" y="172" width="192" height="104"/>
          <rect class="tag" x="532" y="180" width="68" height="16"/><text class="tag-text" x="566" y="191" text-anchor="middle">SESSION</text>
          <text class="name" x="616" y="224" text-anchor="middle">PlaybackSession</text>
          <text class="sub" x="616" y="246" text-anchor="middle">plan · intent · config snapshot</text>
          <text class="sub" x="616" y="261" text-anchor="middle">requestId / loadId · op order</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="768" y="172" width="192" height="104"/>
          <rect class="tag" x="780" y="180" width="66" height="16"/><text class="tag-text" x="813" y="191" text-anchor="middle">RUNTIME</text>
          <text class="name" x="864" y="224" text-anchor="middle">原生播放运行时</text>
          <text class="sub" x="864" y="246" text-anchor="middle">NativePlaybackRuntime</text>
          <text class="sub" x="864" y="261" text-anchor="middle">event gate · output epoch · anchor</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="1000" y="172" width="216" height="104"/>
          <rect class="tag" x="1012" y="180" width="58" height="16"/><text class="tag-text" x="1041" y="191" text-anchor="middle">MEDIA</text>
          <text class="name" x="1108" y="224" text-anchor="middle">媒体实例</text>
          <text class="sub" x="1108" y="246" text-anchor="middle">Player · VideoController</text>
          <text class="sub" x="1108" y="261" text-anchor="middle">media_kit · mpv · decoded frames</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="1000" y="356" width="216" height="96"/>
          <rect class="tag" x="1012" y="364" width="58" height="16"/><text class="tag-text" x="1041" y="375" text-anchor="middle">OUTPUT</text>
          <text class="name" x="1108" y="408" text-anchor="middle">输出交接协调</text>
          <text class="sub" x="1108" y="430" text-anchor="middle">token · paint barrier · release</text>
        </g>
        <g class="node store">
          <rect class="bounds" x="1000" y="496" width="216" height="96"/>
          <rect class="tag" x="1012" y="504" width="58" height="16"/><text class="tag-text" x="1041" y="515" text-anchor="middle">PLATFORM</text>
          <text class="name" x="1108" y="548" text-anchor="middle">Surface / Texture 输出</text>
          <text class="sub" x="1108" y="570" text-anchor="middle">Android Surface · Windows texture</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="48" y="396" width="192" height="96"/>
          <rect class="tag" x="60" y="404" width="58" height="16"/><text class="tag-text" x="89" y="415" text-anchor="middle">FACADE</text>
          <text class="name" x="144" y="448" text-anchor="middle">PlPlayerController</text>
          <text class="sub" x="144" y="470" text-anchor="middle">snapshot projection · UI</text>
        </g>

        <line x1="32" y1="648" x2="1248" y2="648" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
        <text class="legend-text" x="40" y="680">图例</text>
        <line x1="100" y1="676" x2="148" y2="676" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#player-arrow-link)"/>
        <text class="legend-text" x="160" y="680">页面提交</text>
        <line x1="300" y1="676" x2="348" y2="676" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#player-arrow)"/>
        <text class="legend-text" x="360" y="680">控制 / 资源流</text>
        <line x1="520" y1="676" x2="568" y2="676" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#player-arrow)"/>
        <text class="legend-text" x="580" y="680">状态投影</text>
        <rect x="720" y="666" width="20" height="18" rx="4" fill="rgba(191,69,32,.08)" stroke="#bf4520"/>
        <text class="legend-text" x="752" y="680">会话规范状态</text>
      </svg>
    </div>
    <figcaption>页面装配播放计划，Owner 管理页面控制权，Session 串行协调命令并发布快照，Runtime 管理原生播放器和输出。资源槽等待 Player.released 后才可供下一实例使用；媒体时钟与视频采样使用独立通道。</figcaption>
  </figure>
</main>
</body>
</html>
