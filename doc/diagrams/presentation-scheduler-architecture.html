<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>呈现调度引擎架构 | PiliAurora</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:light; --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580; --accent:#bf4520; --accent-tint:rgba(191,69,32,.08); --link:#2e5aa8; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:'Geist','Noto Sans SC',system-ui,sans-serif; }
    main { max-width:1360px; margin:0 auto; padding:32px 0 24px; } h1 { margin:0 28px 8px; font:400 28px/1.2 'Instrument Serif','Noto Serif SC',serif; }
    .kicker { margin:0 28px 18px; color:var(--muted); font:500 11px/1.5 'Geist Mono',monospace; letter-spacing:.08em; }
    figure { margin:0; }
    .diagram-scroll { width:100%; overflow-x:auto; } svg { display:block; width:100%; min-width:1280px; height:auto; }
    figcaption { max-width:1050px; margin:12px 28px 0; color:var(--muted); font-size:13px; line-height:1.7; }
    .zone { fill:rgba(45,49,66,.02); stroke:rgba(45,49,66,.10); stroke-width:1; } .zone-mask { fill:var(--paper); }
    .zone-label { fill:var(--soft); font:500 12px 'Geist','Noto Sans SC',sans-serif; }
    .edge { fill:none; stroke:var(--muted); stroke-width:1.2; marker-end:url(#sched-arrow); }
    .edge-return { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:5 4; marker-end:url(#sched-arrow); }
    .node rect.bounds { stroke-width:1; rx:6; } .backend rect.bounds { fill:#fff; stroke:var(--ink); }
    .focal rect.bounds { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.2; }
    .store rect.bounds { fill:rgba(45,49,66,.05); stroke:var(--muted); }
    .input rect.bounds { fill:rgba(79,93,117,.10); stroke:var(--soft); }
    .tag { fill:var(--paper); stroke:rgba(45,49,66,.24); stroke-width:.8; rx:2; }
    .tag-text { fill:var(--muted); font:500 8px 'Geist Mono',monospace; letter-spacing:.08em; }
    .name { fill:var(--ink); font:600 14px 'Geist','Noto Sans SC',sans-serif; }
    .sub { fill:var(--muted); font:400 9px 'Geist Mono',monospace; }
    .legend-text { fill:var(--muted); font:500 12px 'Geist','Noto Sans SC',sans-serif; }
  </style>
</head>
<body>
<main>
  <h1>帧调度：引擎身份、相位准入与呈现</h1>
  <p class="kicker">PILIAURORA / PRESENTATION SCHEDULER</p>
  <figure>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1280 720" role="img" aria-labelledby="scheduler-title scheduler-desc">
        <title id="scheduler-title">呈现调度引擎架构</title>
        <desc id="scheduler-desc">展示构建身份选择呈现配置，视频帧采样经代次门控，Android 请求采样用于弹幕相位，Windows 弹幕跟随屏幕刷新。</desc>
        <defs>
          <marker id="sched-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#f5f5f5"/>
        <rect class="zone" x="32" y="84" width="456" height="476" rx="8"/>
        <rect class="zone" x="504" y="84" width="344" height="548" rx="8"/>
        <rect class="zone" x="864" y="84" width="384" height="476" rx="8"/>
        <rect class="zone-mask" x="52" y="88" width="144" height="18"/><text class="zone-label" x="60" y="102">构建与配置</text>
        <rect class="zone-mask" x="524" y="88" width="148" height="18"/><text class="zone-label" x="532" y="102">DART 帧调度</text>
        <rect class="zone-mask" x="884" y="88" width="180" height="18"/><text class="zone-label" x="892" y="102">FLUTTER / 平台呈现</text>

        <path class="edge" d="M240 220 H280"/>
        <path class="edge" d="M472 220 H900"/>
        <path class="edge" d="M376 268 V356 H616 V404"/>
        <path class="edge" d="M236 456 H280"/>
        <path class="edge" d="M472 456 H520"/>
        <text class="sub" x="496" y="442" text-anchor="middle">ANDROID</text>
        <path class="edge" d="M712 456 H960"/>
        <path class="edge" d="M1060 316 V404"/>
        <path class="edge-return" d="M1088 404 V316"/>
        <path class="edge" d="M616 508 V548"/>

        <g class="node input">
          <rect class="bounds" x="48" y="172" width="192" height="96"/>
          <rect class="tag" x="60" y="180" width="54" height="16"/><text class="tag-text" x="87" y="191" text-anchor="middle">BUILD</text>
          <text class="name" x="144" y="224" text-anchor="middle">引擎构建身份</text>
          <text class="sub" x="144" y="248" text-anchor="middle">profile · patch · binary digest</text>
        </g>
        <g class="node focal">
          <rect class="bounds" x="280" y="172" width="192" height="96"/>
          <rect class="tag" x="292" y="180" width="58" height="16"/><text class="tag-text" x="321" y="191" text-anchor="middle">SELECT</text>
          <text class="name" x="376" y="224" text-anchor="middle">呈现配置校验 / 选择</text>
          <text class="sub" x="376" y="248" text-anchor="middle">standard · androidFramePlan</text>
          <text class="sub" x="376" y="263" text-anchor="middle">windowsDwmPaced · identity</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="900" y="156" width="320" height="160"/>
          <rect class="tag" x="912" y="164" width="76" height="16"/><text class="tag-text" x="950" y="175" text-anchor="middle">ENGINE</text>
          <text class="name" x="1060" y="208" text-anchor="middle">Flutter 帧呈现路径</text>
          <text class="sub" x="1060" y="232" text-anchor="middle">Android: FrameTimeline → Raster → EGL</text>
          <text class="sub" x="1060" y="251" text-anchor="middle">Windows: DWM QPC → Surface / DComp</text>
          <text class="sub" x="1060" y="270" text-anchor="middle">Standard: Choreographer / VSync fallback</text>
          <text class="sub" x="1060" y="292" text-anchor="middle">invalid timing falls back · custom profile needs identity</text>
        </g>
        <g class="node input">
          <rect class="bounds" x="44" y="404" width="192" height="104"/>
          <rect class="tag" x="56" y="412" width="68" height="16"/><text class="tag-text" x="90" y="423" text-anchor="middle">SAMPLES</text>
          <text class="name" x="140" y="456" text-anchor="middle">原生视频输出采样</text>
          <text class="sub" x="140" y="480" text-anchor="middle">output token · sample batch</text>
          <text class="sub" x="140" y="495" text-anchor="middle">request / consume timing</text>
        </g>
        <g class="node store">
          <rect class="bounds" x="280" y="404" width="192" height="104"/>
          <rect class="tag" x="292" y="412" width="60" height="16"/><text class="tag-text" x="322" y="423" text-anchor="middle">GATE</text>
          <text class="name" x="376" y="456" text-anchor="middle">视频帧采样门控</text>
          <text class="sub" x="376" y="480" text-anchor="middle">PlaybackVideoFrameTimings</text>
          <text class="sub" x="376" y="495" text-anchor="middle">admission ≠ presented evidence</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="520" y="404" width="192" height="104"/>
          <rect class="tag" x="532" y="412" width="76" height="16"/><text class="tag-text" x="570" y="423" text-anchor="middle">DANMAKU</text>
          <text class="name" x="616" y="456" text-anchor="middle">弹幕帧调度</text>
          <text class="sub" x="616" y="480" text-anchor="middle">DanmakuFrameScheduler</text>
          <text class="sub" x="616" y="495" text-anchor="middle">viewEpoch · sampleSeq · targetUs</text>
        </g>
        <g class="node backend">
          <rect class="bounds" x="960" y="404" width="200" height="104"/>
          <rect class="tag" x="972" y="412" width="68" height="16"/><text class="tag-text" x="1006" y="423" text-anchor="middle">TICKER</text>
          <text class="name" x="1060" y="456" text-anchor="middle">FrameRateTicker</text>
          <text class="sub" x="1060" y="480" text-anchor="middle">screen refresh · target cadence</text>
          <text class="sub" x="1060" y="495" text-anchor="middle">Android phase · Windows display</text>
        </g>
        <g class="node store">
          <rect class="bounds" x="520" y="548" width="192" height="64"/>
          <rect class="tag" x="532" y="554" width="82" height="16"/><text class="tag-text" x="573" y="565" text-anchor="middle">DIAGNOSTICS</text>
          <text class="sub" x="616" y="589" text-anchor="middle">identity · phase · fallback</text>
        </g>

        <line x1="32" y1="648" x2="1248" y2="648" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
        <text class="legend-text" x="40" y="680">图例</text>
        <line x1="100" y1="676" x2="148" y2="676" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sched-arrow)"/><text class="legend-text" x="160" y="680">配置 / 调度</text>
        <line x1="316" y1="676" x2="364" y2="676" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#sched-arrow)"/><text class="legend-text" x="376" y="680">回传 timing</text>
        <rect x="520" y="666" width="20" height="18" rx="4" fill="rgba(79,93,117,.10)" stroke="#5a6580"/><text class="legend-text" x="552" y="680">输入 / 准入证据</text>
        <rect x="760" y="666" width="20" height="18" rx="4" fill="rgba(191,69,32,.08)" stroke="#bf4520"/><text class="legend-text" x="792" y="680">配置决策点</text>
        <rect x="972" y="666" width="20" height="18" rx="4" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/><text class="legend-text" x="1004" y="680">状态 / 诊断</text>
      </svg>
    </div>
    <figcaption>Android 使用通过门控的刷新请求采样学习视频相位；纹理消费用于出画证据。Windows 弹幕跟随屏幕，消费采样用于诊断。自编配置须匹配引擎身份；暂停、缓冲、seek 和输出重配会关闭相位准入。</figcaption>
  </figure>
</main>
</body>
</html>
